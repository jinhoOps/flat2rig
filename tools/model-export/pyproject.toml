[project]
name = "flat2rig-model-export"
version = "0.1.0"
description = "Reproducible ONNX export and PyTorch parity verification for flat2rig"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anime-face-detector @ git+https://github.com/hysts/anime-face-detector.git@98a9fb480fa04bdd96acbe4d98da191a898267f3",
    "mobile-sam @ git+https://github.com/ChaoningZhang/MobileSAM.git@f706ad9c4eb7f219c00d9050e46328518ffb65d2",
    "huggingface-hub>=0.30.0",
    "numpy>=1.26.4",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "onnxscript>=0.2.0",
    "opencv-python-headless>=4.10.0.84",
    "pillow>=10.4.0",
    "psutil>=6.0.0",
    "safetensors>=0.5.3",
    "timm>=1.0.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
