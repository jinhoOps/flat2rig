[package]
name = "flat2rig"
version = "0.2.0-2"
edition = "2021"
rust-version = "1.88"
default-run = "flat2rig"
description = "Live2D Cubism preparation studio"
license = "MIT"

[lib]
name = "flat2rig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
delaunator = "1"
glam = { version = "0.30", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "native-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package.flat2rig]
opt-level = 2
